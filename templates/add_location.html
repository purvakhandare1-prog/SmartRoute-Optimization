<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Location | SmartRoute Optimization</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container">

        <a href="/dashboard" class="navbar-brand fw-bold fs-4">

            🚚 SmartRoute Optimization

        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white text-center py-4">

                    <h2>

                        <i class="bi bi-geo-alt-fill"></i>

                        Add Delivery Location

                    </h2>

                    <p class="mb-0">

                        Enter the delivery location details below

                    </p>

                </div>

                <div class="card-body p-4">

                    <form method="POST">

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="bi bi-building"></i>

                                Location Name

                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg"
                                name="name"
                                placeholder="Example: Warehouse"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="bi bi-compass"></i>

                                Latitude

                            </label>

                            <input
                                type="number"
                                step="any"
                                class="form-control form-control-lg"
                                name="latitude"
                                placeholder="Example: 21.1458"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                <i class="bi bi-compass-fill"></i>

                                Longitude

                            </label>

                            <input
                                type="number"
                                step="any"
                                class="form-control form-control-lg"
                                name="longitude"
                                placeholder="Example: 79.0882"
                                required>

                        </div>

                        <div class="d-grid gap-3">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg">

                                <i class="bi bi-check-circle-fill"></i>

                                Save Location

                            </button>

                            <a
                                href="/locations"
                                class="btn btn-outline-secondary btn-lg">

                                <i class="bi bi-arrow-left-circle"></i>

                                Back to Locations

                            </a>

                        </div>

                    </form>

                </div>

            </div>

            <div class="text-center mt-4 text-muted">

                <small>

                    SmartRoute Optimization System • Dynamic Programming (TSP)

                </small>

            </div>

        </div>

    </div>

</div>

</body>

</html>
