<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Locations | SmartRoute Optimization</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🚚 SmartRoute Optimization
        </a>

        <div>

            <a href="/dashboard" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/add-location" class="btn btn-success">
                ➕ Add Location
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold">

            📍 Delivery Locations

        </h2>

        <span class="badge bg-primary fs-6">

            Total :
            {{ locations|length }}

        </span>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <input
                type="text"
                id="search"
                class="form-control mb-4"
                placeholder="🔍 Search Location..."
                onkeyup="searchTable()">

            <div class="table-responsive">

                <table class="table table-hover table-bordered align-middle" id="locationTable">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Location</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                            <th width="220">Actions</th>

                        </tr>

                    </thead>

                    <tbody>

                    {% for location in locations %}

                        <tr>

                            <td>{{ location[0] }}</td>

                            <td>

                                <strong>

                                    {{ location[1] }}

                                </strong>

                            </td>

                            <td>{{ location[2] }}</td>

                            <td>{{ location[3] }}</td>

                            <td>

                                <a
                                    href="/edit-location/{{ location[0] }}"
                                    class="btn btn-warning btn-sm">

                                    <i class="bi bi-pencil-square"></i>

                                    Edit

                                </a>

                                <a
                                    href="/delete-location/{{ location[0] }}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Delete this location?')">

                                    <i class="bi bi-trash-fill"></i>

                                    Delete

                                </a>

                            </td>

                        </tr>

                    {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a href="/dashboard" class="btn btn-primary">

            ← Back to Dashboard

        </a>

    </div>

</div>

<script>

function searchTable(){

    let input=document.getElementById("search");

    let filter=input.value.toUpperCase();

    let table=document.getElementById("locationTable");

    let tr=table.getElementsByTagName("tr");

    for(let i=1;i<tr.length;i++){

        let td=tr[i].getElementsByTagName("td")[1];

        if(td){

            let txt=td.textContent || td.innerText;

            tr[i].style.display=

            txt.toUpperCase().indexOf(filter)>-1

            ? ""

            : "none";

        }

    }

}

</script>

</body>

</html>
